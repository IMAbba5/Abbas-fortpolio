        start_date: 2023
        end_date: present
        summary: Conducting research in deep learning, salient object detection, knowledge distillation, and fine-grained image classification.
        highlights:
          - Developed SPC-Net, a salient object detection framework combining SAM and CLIP through a multi-prompt bank with element-wise maximum aggregation.
          - Designed an adaptive fallback pseudo-prompt generator and a point-classification loss to supervise prompts against ground-truth boundaries.
          - Proposed a knowledge distillation framework transferring Swin-Base teacher knowledge to a GCViT student for bird species classification.
          - Conducted ablation studies on heterogeneous Vision Transformer architectures with experiments run on a single 6GB GPU.

