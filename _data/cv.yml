    Experience:
      - company: Independent Research
        position: Self Employed Researcher
        location: Charsadda, Pakistan
        start_date: 2023
        end_date: present
        highlights:
          - Developed SPC-Net, a salient object detection framework combining SAM and CLIP through a multi-prompt bank with element-wise maximum aggregation, improving S-measure and E-measure on five RGB benchmarks and outperforming RGB-D methods on SIP using RGB-only input.
          - Designed an adaptive fallback pseudo-prompt generator and point-classification loss to address prompt collapse for small and low-contrast salient objects.
          - Proposed a knowledge distillation framework transferring Swin-Base teacher knowledge (89.75%) to GCViT student, improving CUB-200-2011 accuracy from 86.76% to 88.16%; ensemble reached 90.42% on CUB-200-2011 and 89.36% on NABirds.
          - Conducted ablation studies on heterogeneous Vision Transformer architectures (GCViT and Swin Transformer) on a single 6GB GPU.

